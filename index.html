<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blackout Tracker</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #0a0a0a; color: #fff; padding: 15px; max-width: 480px; margin: auto; display: flex; flex-direction: column; height: 100vh; }
        
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid #1f1f1f; }
        h1 { font-size: 16px; font-weight: 800; letter-spacing: 0.5px; color: #fff; }
        .streak-badge { background: #1a1a1a; border: 1px solid #333; padding: 4px 10px; border-radius: 20px; font-size: 12px; color: #a855f7; font-weight: bold; }

        /* Вкладки */
        .tabs { display: flex; background: #121212; border: 1px solid #222; border-radius: 12px; padding: 4px; margin-bottom: 15px; }
        .tab-btn { flex: 1; background: none; border: none; color: #777; padding: 10px; font-size: 13px; font-weight: bold; cursor: pointer; border-radius: 8px; transition: 0.2s; }
        .tab-btn.active { background: #222; color: #fff; }

        .tab-content { display: none; flex: 1; flex-direction: column; overflow-y: auto; }
        .tab-content.active { display: flex; }

        .card { background: #121212; border: 1px solid #1f1f1f; border-radius: 14px; padding: 15px; margin-bottom: 12px; }
        
        /* Таймер */
        .timer-display { font-size: 48px; font-weight: 900; text-align: center; margin: 20px 0; color: #fff; font-variant-numeric: tabular-nums; }
        .timer-controls { display: flex; gap: 10px; }
        .btn { flex: 1; background: #222; color: #fff; border: 1px solid #333; padding: 12px; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 14px; text-align: center; }
        .btn-primary { background: #a855f7; border-color: #a855f7; color: #000; }
        .btn-danger { background: #ef4444; border-color: #ef4444; }
        
        select { width: 100%; background: #1a1a1a; border: 1px solid #333; color: #fff; padding: 10px; border-radius: 10px; font-size: 14px; margin-bottom: 10px; outline: none; }

        /* Чат */
        .chat-box { flex: 1; background: #121212; border: 1px solid #1f1f1f; border-radius: 14px; padding: 15px; overflow-y: auto; margin-bottom: 10px; display: flex; flex-direction: column; gap: 10px; height: 350px; }
        .msg { padding: 10px 14px; border-radius: 10px; font-size: 14px; max-width: 85%; line-height: 1.4; }
        .msg.user { background: #222; align-self: flex-end; color: #fff; }
        .msg.ai { background: #1a1625; border: 1px solid #2d2242; align-self: flex-start; color: #e9d5ff; }
        
        .input-area { display: flex; gap: 8px; }
        input[type="text"], input[type="number"] { flex: 1; background: #121212; border: 1px solid #222; color: #fff; padding: 12px; border-radius: 10px; font-size: 14px; outline: none; }
        .send-btn { background: #fff; color: #000; border: none; width: 45px; border-radius: 10px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; }

        /* Статы */
        .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .stat-box { background: #181818; padding: 12px; border-radius: 10px; border: 1px solid #262626; }
        .stat-box span { display: block; font-size: 20px; font-weight: bold; color: #fff; margin-top: 4px; }
        .stat-box label { font-size: 12px; color: #777; }
    </style>
</head>
<body>

    <header>
        <h1>BLACKOUT SYSTEM</h1>
        <div class="streak-badge" id="streakBadge">🔥 СЕРИЯ: 4 ДНЯ</div>
    </header>

    <!-- Навигация -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('timer')">Таймер</button>
        <button class="tab-btn" onclick="switchTab('chat')">Менеджер</button>
        <button class="tab-btn" onclick="switchTab('stats')">Трекер</button>
    </div>

    <!-- Вкладка 1: Таймер Фокуса -->
    <div id="tab-timer" class="tab-content active">
        <div class="card">
            <label style="font-size: 13px; color: #777; margin-bottom: 6px; display: block;">Категория фокуса:</label>
            <select id="timerCategory">
                <option value="studyHours">Работа / Учёба</option>
                <option value="sportHours">Спорт / Зал</option>
                <option value="otherHours">Творчество / Прочее</option>
            </select>

            <div class="timer-display" id="timerDisplay">00:00</div>

            <div class="timer-controls">
                <button class="btn btn-primary" id="startTimerBtn" onclick="toggleTimer()">Старт</button>
                <button class="btn btn-danger" onclick="resetTimer()">Сброс</button>
            </div>
        </div>
        <div style="text-align: center; font-size: 12px; color: #555;">Таймер автоматически добавляет отработанное время в твою статистику.</div>
    </div>

    <!-- Вкладка 2: Чат с менеджером -->
    <div id="tab-chat" class="tab-content">
        <div class="chat-box" id="chatBox">
            <div class="msg ai">Здарова. Я твой менеджер. Че по задачам на сегодня? Выкладывай прогресс.</div>
        </div>
        <div class="input-area">
            <input type="text" id="messageInput" placeholder="Написать менеджеру..." onkeydown="if(event.key==='Enter') sendMessage()">
            <button class="send-btn" onclick="sendMessage()">➤</button>
        </div>
    </div>

    <!-- Вкладка 3: Трекер и Расходы -->
    <div id="tab-stats" class="tab-content">
        <div class="card">
            <h3 style="font-size: 14px; margin-bottom: 12px;">📊 ПРОГРЕСС ЗА СЕГОДНЯ</h3>
            <div class="stats-grid">
                <div class="stat-box"><label>Работа/Учёба</label><span id="statStudy">0</span>ч</div>
                <div class="stat-box"><label>Спорт</label><span id="statSport">0</span>ч</div>
                <div class="stat-box"><label>Прочее</label><span id="statOther">0</span>ч</div>
                <div class="stat-box"><label>Расходы</label><span id="statMoney">0</span>₽</div>
            </div>
        </div>

        <div class="card">
            <h3 style="font-size: 14px; margin-bottom: 10px;">💸 ЗАПИСАТЬ РАСХОД</h3>
            <div style="display: flex; gap: 8px;">
                <input type="number" id="expenseInput" placeholder="Сумма в рублях...">
                <button class="btn" style="flex: 0 0 100px;" onclick="addExpense()">Записать</button>
            </div>
        </div>
    </div>

    <script>
        const WORKER_URL = "https://dark-credit-4079.floda486.workers.dev/";

        let trackerData = {
            today: { studyHours: 2, sportHours: 0, otherHours: 1, money: 350 },
            goals: { study: 3, sport: 1 },
            streak: 4
        };

        function updateUI() {
            document.getElementById('statStudy').textContent = trackerData.today.studyHours;
            document.getElementById('statSport').textContent = trackerData.today.sportHours;
            document.getElementById('statOther').textContent = trackerData.today.otherHours;
            document.getElementById('statMoney').textContent = trackerData.today.money;
            document.getElementById('streakBadge').textContent = `🔥 СЕРИЯ: ${trackerData.streak} ДНЯ`;
        }
        updateUI();

        // Переключение вкладок
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            
            document.getElementById('tab-' + tabName).classList.add('active');
            event.target.classList.add('active');
        }

        // Логика таймера
        let timerInterval = null;
        let secondsLeft = 0; // Начинаем с нуля (секундомер) или можно сделать обратный отсчет
        let totalSecondsWorked = 0;
        let isRunning = false;

        function toggleTimer() {
            const btn = document.getElementById('startTimerBtn');
            if (!isRunning) {
                isRunning = true;
                btn.textContent = "Пауза";
                btn.classList.add('btn-danger');
                
                timerInterval = setInterval(() => {
                    totalSecondsWorked++;
                    let mins = Math.floor(totalSecondsWorked / 60);
                    let secs = totalSecondsWorked % 60;
                    document.getElementById('timerDisplay').textContent = 
                        String(mins).padStart(2, '0') + ":" + String(secs).padStart(2, '0');
                }, 1000);
            } else {
                isRunning = false;
                btn.textContent = "Продолжить";
                btn.classList.remove('btn-danger');
                clearInterval(timerInterval);

                // Каждые завершенные 60 минут (или для теста можно меньше) записываем в часы
                let hoursWorked = parseFloat((totalSecondsWorked / 3600).toFixed(1));
                if (hoursWorked > 0) {
                    const category = document.getElementById('timerCategory').value;
                    trackerData.today[category] = parseFloat((trackerData.today[category] + hoursWorked).toFixed(1));
                    totalSecondsWorked = 0; // сбрасываем счетчик текущей сессии
                    updateUI();
                }
            }
        }

        function resetTimer() {
            isRunning = false;
            clearInterval(timerInterval);
            totalSecondsWorked = 0;
            document.getElementById('timerDisplay').textContent = "00:00";
            const btn = document.getElementById('startTimerBtn');
            btn.textContent = "Старт";
            btn.classList.remove('btn-danger');
        }

        // Расходы
        function addExpense() {
            const input = document.getElementById('expenseInput');
            const val = parseInt(input.value);
            if (isNaN(val) || val <= 0) return;

            trackerData.today.money += val;
            input.value = '';
            updateUI();
        }

        // Чат с ИИ
        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const chatBox = document.getElementById('chatBox');
            const text = input.value.trim();
            if (!text) return;

            chatBox.innerHTML += `<div class="msg user">${text}</div>`;
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch(WORKER_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ 
                        message: text,
                        tracker: trackerData 
                    })
                });

                const data = await response.json();
                if (data.reply) {
                    chatBox.innerHTML += `<div class="msg ai">${data.reply}</div>`;
                } else {
                    chatBox.innerHTML += `<div class="msg ai" style="color:#ef4444;">Ошибка: ${data.error}</div>`;
                }
            } catch (err) {
                chatBox.innerHTML += `<div class="msg ai" style="color:#ef4444;">Ошибка соединения с сервером.</div>`;
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
