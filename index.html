<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Blackout Tracker</title>
    <style>
        body { background: #0d0d0d; color: #fff; font-family: sans-serif; padding: 20px; max-width: 600px; margin: auto; }
        .chat-box { background: #121212; border: 1px solid #2a2a2a; padding: 15px; border-radius: 12px; height: 250px; overflow-y: scroll; margin-bottom: 15px; }
        .input-box { display: flex; gap: 10px; }
        input, button { background: #1a1a1a; border: 1px solid #333; color: #fff; padding: 10px; border-radius: 8px; font-size: 14px; outline: none; }
        input { flex: 1; }
        button { cursor: pointer; background: #333; font-weight: bold; }
        button:hover { background: #444; }
    </style>
</head>
<body>

    <h2 style="font-size: 18px; margin-bottom: 15px;">🖤 BLACKOUT MANAGER</h2>

    <!-- Чат с ИИ -->
    <div class="chat-box" id="chatBox">
        <div style="color: #777;">Броузерный чат на связи. Пиши задачу или вопрос...</div>
    </div>
    <div class="input-box">
        <input type="text" id="messageInput" placeholder="Написать менеджеру..." onkeydown="if(event.key==='Enter') sendMessage()">
        <button onclick="sendMessage()">➤</button>
    </div>

    <!-- ЕБАНУТЫЕ ФИШКИ BLACKOUT TRACKER -->
    <div class="blackout-modules" style="display: flex; flex-direction: column; gap: 15px; margin-top: 20px;">

        <!-- 1. Рулетка битов -->
        <div style="background: #121212; border: 1px solid #2a2a2a; padding: 15px; border-radius: 12px;">
            <h3 style="color: #fff; font-size: 14px; margin-bottom: 8px;">🎲 РУЛЕТКА БИТОВ</h3>
            <div id="rouletteResult" style="color: #a855f7; font-size: 16px; font-weight: bold; margin-bottom: 10px;">Нажми, чтобы получить задачу</div>
            <button onclick="spinBeatRoulette()" style="background: #222; color: #fff; border: 1px solid #444; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-weight: bold;">Крутить рулетку</button>
        </div>

        <!-- 2. Счётчик вылетов FL Studio -->
        <div style="background: #121212; border: 1px solid #2a2a2a; padding: 15px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center;">
            <div>
                <h3 style="color: #fff; font-size: 14px; margin-bottom: 4px;">💥 ВЫЛЕТЫ FL STUDIO</h3>
                <span style="color: #777; font-size: 12px;">Рейдж-фактор за сегодня</span>
            </div>
            <div style="display: flex; align-items: center; gap: 10px;">
                <span id="crashCount" style="color: #ef4444; font-size: 20px; font-weight: bold;">0</span>
                <button onclick="addCrash()" style="background: #ef4444; color: #fff; border: none; width: 32px; height: 32px; border-radius: 8px; font-weight: bold; cursor: pointer;">+</button>
            </div>
        </div>

        <!-- 3. Кладбище недоделок -->
        <div style="background: #121212; border: 1px solid #2a2a2a; padding: 15px; border-radius: 12px;">
            <h3 style="color: #fff; font-size: 14px; margin-bottom: 8px;">🪦 КЛАДБИЩЕ НЕДОДЕЛОК</h3>
            <input type="text" id="deadProjectInput" placeholder="Название мертвого бита..." style="width: 100%; box-sizing: border-box; margin-bottom: 8px;">
            <button onclick="addDeadProject()" style="background: #333; color: #fff; border: none; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 12px;">Закопать проект</button>
            <ul id="graveyardList" style="margin-top: 10px; padding-left: 15px; color: #888; font-size: 13px;"></ul>
        </div>

    </div>

    <script>
        // Ссылка на твой воркер в Cloudflare
        const WORKER_URL = "https://dark-credit-4079.floda486.workers.dev/";

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const chatBox = document.getElementById('chatBox');
            const text = input.value.trim();
            if (!text) return;

            chatBox.innerHTML += `<div style="margin-bottom: 8px;"><b>Ты:</b> ${text}</div>`;
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch(WORKER_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: text })
                });

                const data = await response.json();
                if (data.reply) {
                    chatBox.innerHTML += `<div style="margin-bottom: 8px; color: #a855f7;"><b>Manager:</b> ${data.reply}</div>`;
                } else {
                    chatBox.innerHTML += `<div style="margin-bottom: 8px; color: #ef4444;"><b>Ошибка:</b> ${data.error}</div>`;
                }
            } catch (err) {
                chatBox.innerHTML += `<div style="margin-bottom: 8px; color: #ef4444;"><b>Ошибка сети:</b> ${err.message}</div>`;
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // Логика рулетки битов
        function spinBeatRoulette() {
            const bpms = [130, 140, 142, 145, 150, 155, 160];
            const keys = ['F minor', 'C# minor', 'D# minor', 'G minor', 'A minor'];
            const genres = ['Jerk Drill', 'UK Drill', 'Hoodtrap', 'Jersey Club', 'Sexy Drill'];
            
            const randomBpm = bpms[Math.floor(Math.random() * bpms.length)];
            const randomKey = keys[Math.floor(Math.random() * keys.length)];
            const randomGenre = genres[Math.floor(Math.random() * genres.length)];
            
            document.getElementById('rouletteResult').textContent = `${randomBpm} BPM • ${randomKey} • ${randomGenre}`;
        }

        // Счётчик вылетов
        let crashes = 0;
        function addCrash() {
            crashes++;
            document.getElementById('crashCount').textContent = crashes;
        }

        // Кладбище проектов
        const graveyard = [];
        function addDeadProject() {
            const input = document.getElementById('deadProjectInput');
            if (!input.value.trim()) return;
            
            graveyard.push(input.value);
            input.value = '';
            
            const list = document.getElementById('graveyardList');
            list.innerHTML = graveyard.map(item => `<li style="margin-bottom: 4px;">🪦 ${item}</li>`).join('');
        }
    </script>
</body>
</html>
