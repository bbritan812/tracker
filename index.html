<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Blackout Tracker</title>
    <!-- Telegram WebApp -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0a0a0a; color: #f3f4f6; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; user-select: none; }
        .tab-content { display: none; }
        .tab-content.active { display: flex; }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: #121212; }
        ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 4px; }
    </style>
</head>
<body class="flex flex-col h-screen max-w-md mx-auto p-3 justify-between">

    <!-- ШАПКА -->
    <header class="flex justify-between items-center pb-3 border-b border-zinc-800">
        <div>
            <h1 class="text-xs font-black tracking-widest text-white">BLACKOUT SYSTEM</h1>
            <p class="text-[10px] text-zinc-500" id="currentDate">Загрузка...</p>
        </div>
        <div class="bg-zinc-900 border border-zinc-800 px-3 py-1 rounded-full text-xs font-bold text-purple-400">
            🔥 4 ДНЯ
        </div>
    </header>

    <!-- КОНТЕНТ -->
    <main class="flex-1 flex flex-col overflow-hidden py-3 relative">

        <!-- 1. ДАШБОРД -->
        <div id="tab-dashboard" class="tab-content active flex-col gap-3 overflow-y-auto">
            <div class="bg-zinc-900/80 border border-zinc-800 p-4 rounded-2xl shadow-lg">
                <h2 class="text-sm font-bold text-white mb-1">Здарова, бро ⚡️</h2>
                <p class="text-xs text-zinc-400 mb-3">Система в норме. Контролируй процесс.</p>
                <div class="grid grid-cols-2 gap-2">
                    <div class="bg-zinc-950 p-3 rounded-xl border border-zinc-800/50">
                        <span class="text-[10px] text-zinc-500 uppercase font-semibold">Сделано задач</span>
                        <span class="text-lg font-black text-purple-400 mt-0.5 block" id="dashTasks">0 / 0</span>
                    </div>
                    <div class="bg-zinc-950 p-3 rounded-xl border border-zinc-800/50">
                        <span class="text-[10px] text-zinc-500 uppercase font-semibold">Фокус</span>
                        <span class="text-lg font-black text-white mt-0.5 block" id="dashTimer">25:00</span>
                    </div>
                </div>
            </div>

            <div class="bg-zinc-900/80 border border-zinc-800 p-4 rounded-2xl flex flex-col gap-2">
                <span class="text-xs font-bold uppercase tracking-wider text-zinc-400">⚡️ Быстрые действия</span>
                <div class="flex gap-2">
                    <button onclick="switchTab('timer')" class="flex-1 bg-purple-600 hover:bg-purple-500 text-black font-bold py-2.5 rounded-xl text-xs transition">Таймер</button>
                    <button onclick="switchTab('tasks')" class="flex-1 bg-zinc-800 hover:bg-zinc-700 text-white font-bold py-2.5 rounded-xl text-xs transition">Задачи</button>
                </div>
            </div>
        </div>

        <!-- 2. ЗАДАЧИ -->
        <div id="tab-tasks" class="tab-content flex-col gap-3 flex-1 overflow-hidden">
            <div class="bg-zinc-900/80 border border-zinc-800 p-3 rounded-2xl flex flex-col gap-2">
                <input type="text" id="taskInput" placeholder="Новая задача..." class="bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 text-xs text-white outline-none focus:border-purple-500">
                <div class="flex gap-2">
                    <select id="taskCategory" class="flex-1 bg-zinc-950 border border-zinc-800 text-xs text-zinc-300 p-2 rounded-xl outline-none">
                        <option value="Работа">💼 Работа</option>
                        <option value="Учёба">📚 Учёба</option>
                        <option value="Музыка">🎧 Музыка</option>
                        <option value="Спорт">⚡️ Спорт</option>
                        <option value="Личное">👤 Личное</option>
                    </select>
                    <button onclick="addTask()" class="bg-purple-600 hover:bg-purple-500 text-black font-bold px-4 py-2 rounded-xl text-xs transition">Добавить</button>
                </div>
            </div>
            <div id="taskList" class="flex-1 overflow-y-auto flex flex-col gap-2"></div>
        </div>

        <!-- 3. ТАЙМЕР -->
        <div id="tab-timer" class="tab-content flex-col items-center justify-center flex-1 bg-zinc-900/80 border border-zinc-800 p-6 rounded-2xl gap-6">
            <div class="text-6xl font-black tracking-wider text-white font-mono" id="timerDisplay">25:00</div>
            <div class="flex gap-2 w-full">
                <button id="timerToggleBtn" onclick="toggleTimer()" class="flex-1 bg-purple-600 text-black font-bold py-3 rounded-xl text-sm transition">Старт</button>
                <button onclick="resetTimer()" class="bg-zinc-800 text-zinc-300 font-bold px-4 py-3 rounded-xl text-sm transition">Сброс</button>
            </div>
        </div>

        <!-- 4. ИИ МЕНЕДЖЕР -->
        <div id="tab-ai" class="tab-content flex-col flex-1 overflow-hidden gap-2">
            <div id="chatBox" class="flex-1 bg-zinc-900/80 border border-zinc-800 p-3 rounded-2xl overflow-y-auto flex flex-col gap-2 text-xs">
                <div class="bg-purple-950/60 border border-purple-800/50 text-purple-200 p-3 rounded-xl self-start max-w-[85%]">
                    Здарова. Менеджер на связи. Че по планам на сегодня? Выкладывай.
                </div>
            </div>
            <div class="flex gap-2">
                <input type="text" id="chatInput" placeholder="Написать менеджеру..." onkeydown="if(event.key==='Enter') sendAiMessage()" class="flex-1 bg-zinc-900 border border-zinc-800 rounded-xl px-3 py-2 text-xs text-white outline-none focus:border-purple-500">
                <button onclick="sendAiMessage()" class="bg-purple-600 text-black font-bold px-4 py-2 rounded-xl text-xs">➤</button>
            </div>
        </div>

    </main>

    <!-- НАВИГАЦИЯ -->
    <nav class="flex bg-zinc-900 border border-zinc-800 rounded-2xl p-1.5 justify-between">
        <button onclick="switchTab('dashboard')" class="nav-btn flex-1 py-2 text-[11px] font-bold text-center rounded-xl text-purple-400 bg-zinc-800 transition" data-tab="dashboard">Главная</button>
        <button onclick="switchTab('tasks')" class="nav-btn flex-1 py-2 text-[11px] font-bold text-center rounded-xl text-zinc-500 transition" data-tab="tasks">Задачи</button>
        <button onclick="switchTab('timer')" class="nav-btn flex-1 py-2 text-[11px] font-bold text-center rounded-xl text-zinc-500 transition" data-tab="timer">Таймер</button>
        <button onclick="switchTab('ai')" class="nav-btn flex-1 py-2 text-[11px] font-bold text-center rounded-xl text-zinc-500 transition" data-tab="ai">Менеджер</button>
    </nav>

    <script>
        // Инициализация Telegram WebApp
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.expand();
            tg.ready();
            if (tg.setHeaderColor) tg.setHeaderColor('#0a0a0a');
        }

        const WORKER_URL = "https://dark-credit-4079.floda486.workers.dev/";

        document.getElementById('currentDate').textContent = new Date().toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', weekday: 'short' });

        // Вкладки
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('text-purple-400', 'bg-zinc-800');
                btn.classList.add('text-zinc-500');
                if (btn.dataset.tab === tabName) {
                    btn.classList.add('text-purple-400', 'bg-zinc-800');
                    btn.classList.remove('text-zinc-500');
                }
            });
            document.getElementById('tab-' + tabName).classList.add('active');
        }

        // Задачи
        let tasks = JSON.parse(localStorage.getItem('blackout_tasks')) || [
            { id: 1, text: 'Написать новый бит в FL Studio', completed: false, category: 'Музыка' },
            { id: 2, text: 'Сделать тренировку', completed: true, category: 'Спорт' }
        ];

        function saveTasks() {
            localStorage.setItem('blackout_tasks', JSON.stringify(tasks));
            renderTasks();
        }

        function renderTasks() {
            const list = document.getElementById('taskList');
            const completedCount = tasks.filter(t => t.completed).length;
            document.getElementById('dashTasks').textContent = `${completedCount} / ${tasks.length}`;

            if (tasks.length === 0) {
                list.innerHTML = '<div class="text-center text-zinc-600 text-xs py-8">Список задач пуст</div>';
                return;
            }

            list.innerHTML = tasks.map(t => `
                <div class="bg-zinc-900/60 border border-zinc-800/60 p-3 rounded-xl flex items-center justify-between text-xs">
                    <div class="flex items-center gap-2.5">
                        <input type="checkbox" ${t.completed ? 'checked' : ''} onchange="toggleTask(${t.id})" class="accent-purple-600 w-4 h-4 rounded cursor-pointer">
                        <div>
                            <span class="${t.completed ? 'line-through text-zinc-600 block' : 'text-white block font-medium'}">${t.text}</span>
                            <span class="text-[10px] text-purple-400 font-semibold">${t.category || 'Общее'}</span>
                        </div>
                    </div>
                    <button onclick="deleteTask(${t.id})" class="text-zinc-600 hover:text-red-400 font-bold px-2 py-1 transition">✕</button>
                </div>
            `).join('');
        }

        function addTask() {
            const input = document.getElementById('taskInput');
            const cat = document.getElementById('taskCategory').value;
            const text = input.value.trim();
            if (!text) return;
            tasks.push({ id: Date.now(), text, completed: false, category: cat });
            input.value = '';
            saveTasks();
        }

        function toggleTask(id) {
            tasks = tasks.map(t => t.id === id ? { ...t, completed: !t.completed } : t);
            saveTasks();
        }

        function deleteTask(id) {
            tasks = tasks.filter(t => t.id !== id);
            saveTasks();
        }
        renderTasks();

        // Таймер
        let timerSeconds = 25 * 60;
        let timerInterval = null;
        let isTimerRunning = false;

        function updateTimerDisplay() {
            let m = Math.floor(timerSeconds / 60);
            let s = timerSeconds % 60;
            const formatted = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
            document.getElementById('timerDisplay').textContent = formatted;
            document.getElementById('dashTimer').textContent = formatted;
        }

        function toggleTimer() {
            const btn = document.getElementById('timerToggleBtn');
            if (!isTimerRunning) {
                isTimerRunning = true;
                btn.textContent = "Пауза";
                btn.classList.replace('bg-purple-600', 'bg-red-600');
                
                timerInterval = setInterval(() => {
                    if (timerSeconds > 0) {
                        timerSeconds--;
                        updateTimerDisplay();
                    } else {
                        clearInterval(timerInterval);
                        isTimerRunning = false;
                        alert('Время вышло! Отличная работа.');
                        resetTimer();
                    }
                }, 1000);
            } else {
                isTimerRunning = false;
                btn.textContent = "Старт";
                btn.classList.replace('bg-red-600', 'bg-purple-600');
                clearInterval(timerInterval);
            }
        }

        function resetTimer() {
            clearInterval(timerInterval);
            isTimerRunning = false;
            timerSeconds = 25 * 60;
            updateTimerDisplay();
            const btn = document.getElementById('timerToggleBtn');
            btn.textContent = "Старт";
            btn.classList.replace('bg-red-600', 'bg-purple-600');
        }
        updateTimerDisplay();

        // Чат с ИИ
        async function sendAiMessage() {
            const input = document.getElementById('chatInput');
            const chatBox = document.getElementById('chatBox');
            const text = input.value.trim();
            if (!text) return;

            chatBox.innerHTML += `<div class="bg-zinc-800 text-white p-3 rounded-xl self-end max-w-[85%]">${text}</div>`;
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const res = await fetch(WORKER_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: text, tracker: { tasks, streak: 4 } })
                });
                const data = await res.json();
                if (data.reply) {
                    chatBox.innerHTML += `<div class="bg-purple-950/60 border border-purple-800/50 text-purple-200 p-3 rounded-xl self-start max-w-[85%]">${data.reply}</div>`;
                } else {
                    chatBox.innerHTML += `<div class="bg-red-950/50 text-red-400 p-3 rounded-xl self-start">Ошибка ответа ИИ</div>`;
                }
            } catch (err) {
                chatBox.innerHTML += `<div class="bg-red-950/50 text-red-400 p-3 rounded-xl self-start">Ошибка связи с воркером</div>`;
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
