<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Трекер</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0f0f11;
            --card-bg: #18181b;
            --accent-color: #7c3aed;
            --accent-hover: #6d28d9;
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --border-color: #27272a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 16px;
            max-width: 600px;
            margin: 0 auto;
        }

        h1 {
            font-size: 20px;
            margin-bottom: 16px;
            font-weight: 600;
        }

        .tabs {
            display: flex;
            background: var(--card-bg);
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 16px;
            border: 1px solid var(--border-color);
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 10px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-muted);
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .tab.active {
            background: var(--accent-color);
            color: var(--text-main);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px;
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .stat-value {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-main);
        }

        .section-title {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-gap: 0.5px;
            letter-spacing: 0.5px;
        }

        .records-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 80px;
        }

        .record-item {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .record-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .record-title {
            font-size: 14px;
            font-weight: 500;
        }

        .record-category {
            font-size: 11px;
            color: var(--accent-color);
            background: rgba(124, 58, 237, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
            width: fit-content;
        }

        .record-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .record-metric {
            font-size: 14px;
            font-weight: 600;
        }

        .delete-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 16px;
            padding: 4px;
            transition: color 0.2s;
        }

        .delete-btn:hover {
            color: #ef4444;
        }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
            margin-top: 40px;
        }

        .add-btn {
            position: fixed;
            bottom: 16px;
            left: 16px;
            right: 16px;
            max-width: 568px;
            margin: 0 auto;
            background: var(--accent-color);
            color: var(--text-main);
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            box-shadow: 0 4px 12px rgba(124, 58, 237, 0.3);
        }

        .add-btn:hover {
            background: var(--accent-hover);
        }

        /* Модальное окно */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: flex-end;
            z-index: 100;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            width: 100%;
            max-width: 600px;
            border-radius: 20px 20px 0 0;
            padding: 20px;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .modal-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-label {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 6px;
            display: block;
        }

        .form-input, .form-select {
            width: 100%;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px;
            color: var(--text-main);
            font-size: 14px;
            outline: none;
        }

        .form-input:focus, .form-select:focus {
            border-color: var(--accent-color);
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-cancel {
            flex: 1;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 12px;
            border-radius: 10px;
            font-weight: 500;
            cursor: pointer;
        }

        .btn-submit {
            flex: 1;
            background: var(--accent-color);
            border: none;
            color: var(--text-main);
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>Трекер</h1>

    <div class="tabs">
        <div class="tab active" onclick="switchTab('today')">Сегодня</div>
        <div class="tab" onclick="switchTab('week')">Неделя</div>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-label">Часы</div>
            <div class="stat-value" id="totalHours">0ч</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Расходы</div>
            <div class="stat-value" id="totalMoney">0 ₽</div>
        </div>
    </div>

    <div class="section-title">Записи</div>
    <div class="records-list" id="recordsList">
        <div class="empty-state">Пока нет записей</div>
    </div>

    <button class="add-btn" onclick="openModal()">+ Добавить запись</button>

    <!-- Модальное окно -->
    <div class="modal" id="recordModal">
        <div class="modal-content">
            <div class="modal-title">Новая запись</div>
            <form id="recordForm" onsubmit="saveRecord(event)">
                <div class="form-group">
                    <label class="form-label">Название / Описание</label>
                    <input type="text" id="recTitle" class="form-input" placeholder="Например: Битмейкинг / Фастфуд" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Категория</label>
                    <select id="recCategory" class="form-select">
                        <option value="Музыка">Музыка</option>
                        <option value="Учеба">Учеба</option>
                        <option value="Траты">Траты</option>
                        <option value="Прочее">Прочее</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Часы (если применимо)</label>
                    <input type="number" step="0.5" id="recHours" class="form-input" placeholder="0">
                </div>
                <div class="form-group">
                    <label class="form-label">Сумма в рублях (если расход)</label>
                    <input type="number" id="recMoney" class="form-input" placeholder="0">
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-cancel" onclick="closeModal()">Отмена</button>
                    <button type="submit" class="btn-submit">Добавить</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let currentTab = 'today';
        let records = JSON.parse(localStorage.getItem('tracker_records')) || [];

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
            event.target.classList.add('active');
            render();
        }

        function openModal() {
            document.getElementById('recordModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('recordModal').classList.remove('active');
            document.getElementById('recordForm').reset();
        }

        function saveRecord(e) {
            e.preventDefault();
            
            const title = document.getElementById('recTitle').value;
            const category = document.getElementById('recCategory').value;
            const hours = parseFloat(document.getElementById('recHours').value) || 0;
            const money = parseFloat(document.getElementById('recMoney').value) || 0;

            const newRecord = {
                id: Date.now(),
                title,
                category,
                hours,
                money,
                date: new Date().toISOString()
            };

            records.unshift(newRecord);
            localStorage.setItem('tracker_records', JSON.stringify(records));

            closeModal();
            render();
        }

        function deleteRecord(id) {
            records = records.filter(item => item.id !== id);
            localStorage.setItem('tracker_records', JSON.stringify(records));
            render();
        }

        function render() {
            const listEl = document.getElementById('recordsList');
            const totalHoursEl = document.getElementById('totalHours');
            const totalMoneyEl = document.getElementById('totalMoney');

            // Фильтрация по вкладкам (сегодня / последние 7 дней)
            const now = new Date();
            const filteredRecords = records.filter(item => {
                const itemDate = new Date(item.date);
                if (currentTab === 'today') {
                    return itemDate.toDateString() === now.toDateString();
                } else {
                    const diffTime = Math.abs(now - itemDate);
                    const diffDays = diffTime / (1000 * 60 * 60 * 24);
                    return diffDays <= 7;
                }
            });

            // Подсчет итогов
            let totalH = 0;
            let totalM = 0;

            filteredRecords.forEach(item => {
                totalH += item.hours;
                totalM += item.money;
            });

            totalHoursEl.textContent = totalH + 'ч';
            totalMoneyEl.textContent = totalM.toLocaleString('ru-RU') + ' ₽';

            // Отрисовка списка
            if (filteredRecords.length === 0) {
                listEl.innerHTML = '<div class="empty-state">Пока нет записей</div>';
                return;
            }

            listEl.innerHTML = filteredRecords.map(item => `
                <div class="record-item">
                    <div class="record-info">
                        <div class="record-title">${item.title}</div>
                        <div class="record-category">${item.category}</div>
                    </div>
                    <div class="record-right">
                        <div class="record-metric">
                            ${item.hours ? item.hours + 'ч' : ''} 
                            ${item.money ? item.money.toLocaleString('ru-RU') + ' ₽' : ''}
                        </div>
                        <button class="delete-btn" onclick="deleteRecord(${item.id})">&times;</button>
                    </div>
                </div>
            `).join('');
        }

        // Инициализация при загрузке
        render();
    </script>
</body>
</html>
